[package]
name = "nox-tls"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
authors = ["Hisoka Labs"]
description = "Sans-IO TLS and HTTP/1.1 client for the Nox anon-rpc worker: the worker holds the TLS keys and a Nox exit relays ciphertext only"
license = "Apache-2.0"
repository = "https://github.com/hisoka-io/nox-sdk"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
ring = "=0.17.14"
webpki-roots = "=1.0.9"
httparse = { version = "1.10", default-features = false, features = ["std"] }
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.114"
js-sys = "0.3"
# Date.now() for certificate validity checks on wasm32-unknown-unknown.
rustls-pki-types = { version = "1.15", features = ["std", "web"] }
# crypto.getRandomValues() for ring.
ring = { version = "=0.17.14", features = ["wasm32_unknown_unknown_js"] }
getrandom = { version = "0.2", features = ["js"] }

# The Mozilla root store compiled in. The worker provenance records this version and
# release date (checked against Cargo.lock); refresh it at every worker release.
[package.metadata.webpki-roots]
version = "1.0.9"
released = "2026-07-18"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-mutable-globals"]
